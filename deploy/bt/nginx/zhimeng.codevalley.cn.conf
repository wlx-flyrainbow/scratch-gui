server {
    listen 80;
    server_name zhimeng.codevalley.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zhimeng.codevalley.cn;

    root /www/wwwroot/zhimeng;
    index index.html;

    # In BaoTa, keep the certificate paths generated by the panel.
    ssl_certificate     /www/server/panel/vhost/cert/zhimeng.codevalley.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/zhimeng.codevalley.cn/privkey.pem;

    client_max_body_size 8m;

    location ~ ^/(auth|entitlement|order|admin|payment|health)(/|$) {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location = /releases.json {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /downloads/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
